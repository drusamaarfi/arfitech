<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Area | Arfi Tech</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans antialiased min-h-screen flex flex-col items-center justify-center">

    <!-- LOGIN SECTION -->
    <div id="login-section" class="w-full max-w-md bg-white p-8 rounded-xl shadow-lg border border-gray-200">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-slate-900">Admin Login</h1>
            <p class="text-sm text-gray-500">Authorized access only.</p>
        </div>
        
        <!-- Login Form with Autofill Support -->
        <form id="login-form" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input type="text" id="admin-user" autocomplete="username" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="admin-pass" autocomplete="current-password" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <button type="submit" class="w-full bg-slate-900 text-white font-bold py-2 rounded-lg hover:bg-slate-800 transition">Login to Dashboard</button>
        </form>
    </div>

    <!-- DASHBOARD SECTION (Hidden by default) -->
    <div id="dashboard-section" class="hidden w-full h-full p-6">
        <div class="max-w-4xl mx-auto bg-white p-8 rounded-xl shadow-md border border-gray-200">
            <div class="flex justify-between items-center border-b pb-4 mb-6">
                <h2 class="text-2xl font-bold text-gray-800">Arfi Tech Workspace</h2>
                <button onclick="logout()" class="text-red-500 text-sm font-bold hover:underline">Logout</button>
            </div>
            
            <form id="post-form" class="space-y-6">
                <!-- Dashboard forms will be here -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Post Title</label>
                        <input type="text" placeholder="Title..." class="w-full px-4 py-2 border rounded-lg focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Category</label>
                        <input type="text" placeholder="AI Tech" class="w-full px-4 py-2 border rounded-lg focus:outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Article Content</label>
                    <textarea rows="8" placeholder="Write content..." class="w-full px-4 py-2 border rounded-lg focus:outline-none"></textarea>
                </div>
                <button type="button" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-500 transition">Publish Post</button>
            </form>
        </div>
    </div>

    <script>
        // Login Logic
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const user = document.getElementById('admin-user').value;
            const pass = document.getElementById('admin-pass').value;

            if (user === 'drusamaarfi' && pass === '727738') {
                // Hide Login, Show Dashboard
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
                document.body.classList.remove('items-center', 'justify-center'); // Fix layout for dashboard
            } else {
                alert('Invalid Username or Password!');
            }
        });

        // Logout Logic
        function logout() {
            document.getElementById('admin-user').value = '';
            document.getElementById('admin-pass').value = '';
            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('login-section').classList.remove('hidden');
            document.body.classList.add('items-center', 'justify-center');
        }
    </script>
</body>
</html>
