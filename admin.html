<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Admin CMS | Arfi Tech</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase SDK (V8 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-gray-50 font-sans antialiased min-h-screen flex flex-col items-center justify-center">

    <!-- 1. LOGIN SECTION -->
    <div id="login-section" class="w-full max-w-md bg-white p-8 rounded-xl shadow-lg border border-gray-200">
        <div class="text-center mb-8">
            <div class="h-16 w-16 bg-slate-900 text-white rounded-full flex items-center justify-center text-2xl font-bold mx-auto mb-4 shadow-inner">AT</div>
            <h1 class="text-2xl font-bold text-slate-900">Admin Login</h1>
            <p class="text-sm text-gray-500">Arfi Tech Secure Workspace</p>
        </div>
        
        <form id="login-form" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input type="text" id="admin-user" autocomplete="username" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="admin-pass" autocomplete="current-password" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2.5 rounded-lg hover:bg-blue-700 transition shadow-md">Login to Dashboard</button>
        </form>
    </div>

    <!-- 2. MAIN DASHBOARD SECTION (Hidden by default) -->
    <div id="dashboard-section" class="hidden w-full min-h-screen bg-gray-100 flex flex-col">
        
        <!-- Top Navbar -->
        <header class="bg-slate-900 text-white shadow-md sticky top-0 z-50">
            <div class="container mx-auto px-6 py-4 flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <div class="h-10 w-10 bg-blue-600 text-white rounded-full flex items-center justify-center font-bold">UA</div>
                    <div>
                        <h2 class="text-lg font-bold leading-tight">Arfi Tech CMS</h2>
                        <p class="text-[10px] text-gray-400 uppercase tracking-wider">Dr Usama Arfi</p>
                    </div>
                </div>
                <div class="flex space-x-4">
                    <a href="index.html" target="_blank" class="text-sm text-gray-300 hover:text-white transition flex items-center">View Site &nearr;</a>
                    <button onclick="logout()" class="text-sm bg-red-600 hover:bg-red-500 px-4 py-1.5 rounded transition font-medium">Logout</button>
                </div>
            </div>
        </header>

        <div class="container mx-auto px-6 py-8 flex flex-col md:flex-row gap-8 flex-grow">
            
            <!-- Sidebar Navigation -->
            <aside class="w-full md:w-64 flex-shrink-0">
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden sticky top-24">
                    <div class="p-4 bg-gray-50 border-b border-gray-200">
                        <span class="text-xs font-bold text-gray-500 uppercase tracking-wider">Menu</span>
                    </div>
                    <nav class="flex flex-col p-2 space-y-1">
                        <button onclick="switchTab('create-post')" id="tab-create" class="text-left px-4 py-3 rounded-lg bg-blue-50 text-blue-700 font-medium transition">✏️ Create New Post</button>
                        <button onclick="switchTab('manage-posts')" id="tab-manage" class="text-left px-4 py-3 rounded-lg text-gray-600 hover:bg-gray-50 font-medium transition">📚 Manage Posts</button>
                        <button onclick="switchTab('manage-categories')" id="tab-categories" class="text-left px-4 py-3 rounded-lg text-gray-600 hover:bg-gray-50 font-medium transition">📂 Manage Categories</button>
                    </nav>
                </div>
            </aside>

            <!-- Main Content Area -->
            <main class="flex-grow bg-white rounded-xl shadow-sm border border-gray-200 p-6 md:p-8">
                
                <!-- TAB A: CREATE POST -->
                <div id="content-create-post" class="block">
                    <h3 class="text-2xl font-bold text-gray-800 mb-6 border-b pb-4">Create New Article</h3>
                    <form id="post-form" class="space-y-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-2">Post Title</label>
                                <input type="text" id="post-title" required placeholder="e.g., Future of AI in Nursing" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 bg-gray-50">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-2">Category</label>
                                <select id="post-category" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 bg-gray-50">
                                    <option value="">Select Category...</option>
                                    <!-- Options will be loaded from Firebase -->
                                </select>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-2">Thumbnail Image Link (Main)</label>
                                <input type="url" id="post-thumb" required placeholder="https://..." class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 bg-gray-50">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-2">Middle Image Link (Optional)</label>
                                <input type="url" id="post-middle-img" placeholder="https://..." class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 bg-gray-50">
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Article Content</label>
                            <textarea id="post-content" required rows="10" placeholder="Yahan apna article likhein. HTML tags allowed (e.g., <b>bold</b>, <br> for new line)" class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 bg-gray-50 leading-relaxed"></textarea>
                        </div>

                        <button type="submit" class="w-full bg-slate-900 text-white font-bold py-3.5 rounded-lg hover:bg-slate-800 transition shadow-lg text-lg">
                            Publish Post to Arfi Tech
                        </button>
                    </form>
                </div>

                <!-- TAB B: MANAGE POSTS -->
                <div id="content-manage-posts" class="hidden">
                    <h3 class="text-2xl font-bold text-gray-800 mb-6 border-b pb-4">Manage Posts</h3>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-100 text-gray-600 text-sm uppercase tracking-wider">
                                    <th class="p-4 rounded-tl-lg">Title</th>
                                    <th class="p-4">Category</th>
                                    <th class="p-4">Date</th>
                                    <th class="p-4 rounded-tr-lg text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="posts-table-body" class="text-sm">
                                <!-- Posts will be loaded here from Firebase -->
                                <tr><td colspan="4" class="p-4 text-center text-gray-500">Loading posts...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- TAB C: MANAGE CATEGORIES -->
                <div id="content-manage-categories" class="hidden">
                    <h3 class="text-2xl font-bold text-gray-800 mb-6 border-b pb-4">Manage Categories</h3>
                    
                    <form id="category-form" class="mb-8 flex gap-4">
                        <input type="text" id="new-category-input" placeholder="Enter new category name..." required class="flex-grow px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 bg-gray-50">
                        <button type="submit" class="bg-slate-900 text-white font-bold px-6 py-2 rounded-lg hover:bg-slate-800 transition">Add Category</button>
                    </form>

                    <div id="categories-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        <!-- Categories will be loaded here from Firebase -->
                        <p class="text-gray-500">Loading categories...</p>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC & FIREBASE -->
    <script>
        // 1. FIREBASE CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyDlCXYhtZtMntiuRPeviR20hmg8v3WiFtA",
            authDomain: "arfi-tech.firebaseapp.com",
            projectId: "arfi-tech",
            storageBucket: "arfi-tech.firebasestorage.app",
            messagingSenderId: "593898208715",
            appId: "1:593898208715:web:d2d6d6ca14ca1592210a4e"
        };

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // 2. LOGIN LOGIC
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('admin-user').value;
            const pass = document.getElementById('admin-pass').value;

            if (user === 'drusamaarfi' && pass === '727738') {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
                document.body.classList.remove('items-center', 'justify-center');
                document.body.classList.add('bg-gray-100');
                
                // Load data from Firebase
                loadCategories();
                loadPosts();
            } else {
                alert('Access Denied! Invalid Username or Password.');
            }
        });

        function logout() {
            location.reload(); // Restarts the page to log out securely
        }

        // 3. TAB SWITCHING LOGIC
        function switchTab(tabId) {
            document.getElementById('content-create-post').classList.add('hidden');
            document.getElementById('content-manage-posts').classList.add('hidden');
            document.getElementById('content-manage-categories').classList.add('hidden');

            ['tab-create', 'tab-manage', 'tab-categories'].forEach(t => {
                document.getElementById(t).className = "text-left px-4 py-3 rounded-lg text-gray-600 hover:bg-gray-50 font-medium transition";
            });

            document.getElementById('content-' + tabId).classList.remove('hidden');
            document.getElementById('tab-' + tabId.replace('content-', '')).className = "text-left px-4 py-3 rounded-lg bg-blue-50 text-blue-700 font-medium transition";
        }

        // 4. MANAGE CATEGORIES
        const categoryForm = document.getElementById('category-form');
        const categorySelect = document.getElementById('post-category');
        const catContainer = document.getElementById('categories-container');

        // Add Category
        categoryForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const catInput = document.getElementById('new-category-input').value;
            db.collection("categories").add({ 
                name: catInput, 
                timestamp: firebase.firestore.FieldValue.serverTimestamp() 
            }).then(() => {
                categoryForm.reset();
                alert("Category Added Successfully!");
            });
        });

        // Load Categories Real-time
        function loadCategories() {
            db.collection("categories").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
                catContainer.innerHTML = '';
                categorySelect.innerHTML = '<option value="">Select Category...</option>';

                snapshot.forEach((doc) => {
                    const data = doc.data();
                    // Add to UI Grid
                    catContainer.innerHTML += `
                        <div class="bg-white border border-gray-200 p-4 rounded-lg flex justify-between items-center shadow-sm">
                            <span class="font-bold text-gray-700">${data.name}</span>
                            <button onclick="deleteCategory('${doc.id}')" class="text-red-500 hover:text-red-700 text-2xl leading-none">&times;</button>
                        </div>`;
                    // Add to Dropdown
                    categorySelect.innerHTML += `<option value="${data.name}">${data.name}</option>`;
                });
            });
        }

        // Delete Category
        window.deleteCategory = function(id) {
            if(confirm("Are you sure you want to delete this category?")) {
                db.collection("categories").doc(id).delete();
            }
        }

        // 5. MANAGE POSTS
        const postForm = document.getElementById('post-form');
        const postsTableBody = document.getElementById('posts-table-body');

        // Create Post
        postForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerText;
            btn.innerText = "Publishing to Arfi Tech...";
            btn.disabled = true;
            
            const postData = {
                title: document.getElementById('post-title').value,
                category: document.getElementById('post-category').value,
                thumbnail: document.getElementById('post-thumb').value,
                middleImage: document.getElementById('post-middle-img').value,
                content: document.getElementById('post-content').value,
                date: new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }),
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            };

            db.collection("posts").add(postData).then(() => {
                alert("Post Published Successfully! 🚀");
                postForm.reset();
                btn.innerText = originalText;
                btn.disabled = false;
                switchTab('manage-posts'); // Switch to manage posts tab to see it
            }).catch(err => {
                alert("Error: " + err.message);
                btn.innerText = originalText;
                btn.disabled = false;
            });
        });

        // Load Posts Real-time
        function loadPosts() {
            db.collection("posts").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
                postsTableBody.innerHTML = '';
                
                if (snapshot.empty) {
                    postsTableBody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-gray-500">No posts found. Create one!</td></tr>';
                    return;
                }

                snapshot.forEach((doc) => {
                    const data = doc.data();
                    postsTableBody.innerHTML += `
                        <tr class="border-b border-gray-100 hover:bg-gray-50 transition">
                            <td class="p-4 font-medium text-gray-800">${data.title}</td>
                            <td class="p-4"><span class="bg-blue-100 text-blue-700 px-2 py-1 rounded text-xs font-bold">${data.category}</span></td>
                            <td class="p-4 text-gray-500">${data.date}</td>
                            <td class="p-4 text-right">
                                <button onclick="deletePost('${doc.id}')" class="text-red-600 hover:text-red-800 font-medium bg-red-50 px-3 py-1 rounded transition">Delete</button>
                            </td>
                        </tr>`;
                });
            });
        }

        // Delete Post
        window.deletePost = function(id) {
            if(confirm("Warning: Ye post permanently delete ho jayegi. Continue?")) {
                db.collection("posts").doc(id).delete();
            }
        }
    </script>
</body>
                            </html>
