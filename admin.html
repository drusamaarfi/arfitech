<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Area | Arfi Tech</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans antialiased min-h-screen flex flex-col items-center justify-center">

    <!-- LOGIN SECTION -->
    <div id="login-section" class="w-full max-w-md bg-white p-8 rounded-xl shadow-lg border border-gray-200">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-slate-900">Admin Login</h1>
            <p class="text-sm text-gray-500">Authorized access only.</p>
        </div>
        
        <form id="login-form" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input type="text" id="admin-user" autocomplete="username" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="admin-pass" autocomplete="current-password" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <button type="submit" class="w-full bg-slate-900 text-white font-bold py-2 rounded-lg hover:bg-slate-800 transition">Login to Dashboard</button>
        </form>
    </div>

    <!-- DASHBOARD SECTION (Hidden by default) -->
    <div id="dashboard-section" class="hidden w-full h-full p-6">
        <div class="max-w-4xl mx-auto bg-white p-8 rounded-xl shadow-md border border-gray-200">
            <div class="flex justify-between items-center border-b pb-4 mb-6">
                <h2 class="text-2xl font-bold text-gray-800">Arfi Tech Workspace</h2>
                <button onclick="logout()" class="text-red-500 text-sm font-bold hover:underline">Logout</button>
            </div>
            
            <form id="post-form" class="space-y-6">
                <!-- Title & Category -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Post Title</label>
                        <input type="text" id="post-title" required placeholder="e.g., Future of AI in Nursing" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Category / Tag</label>
                        <input type="text" id="post-tag" required placeholder="e.g., AI Tech, Web Dev" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>

                <!-- Images Links -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Thumbnail Image (URL)</label>
                        <input type="url" id="post-thumb" required placeholder="https://link-to-main-image.jpg" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <p class="text-[10px] text-gray-500 mt-1">Ye bahar grid mein show hogi.</p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Middle Image (URL) - Optional</label>
                        <input type="url" id="post-middle-img" placeholder="https://link-to-center-image.jpg" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <p class="text-[10px] text-gray-500 mt-1">Ye article ke text ke center mein show hogi.</p>
                    </div>
                </div>

                <!-- Content Area -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Article Content</label>
                    <textarea id="post-content" required rows="8" placeholder="Yahan apna mukammal article likhein... (Aap <br> ya <b> HTML tags bhi use kar sakte hain)" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>

                <button type="submit" id="publish-btn" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-500 transition shadow-md">
                    Publish Post to Live Website
                </button>
            </form>
        </div>
    </div>

    <script>
        // Login Logic
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('admin-user').value;
            const pass = document.getElementById('admin-pass').value;

            if (user === 'drusamaarfi' && pass === '727738') {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
                document.body.classList.remove('items-center', 'justify-center'); 
            } else {
                alert('Invalid Username or Password!');
            }
        });

        // Logout Logic
        function logout() {
            document.getElementById('admin-user').value = '';
            document.getElementById('admin-pass').value = '';
            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('login-section').classList.remove('hidden');
            document.body.classList.add('items-center', 'justify-center');
        }

        // Form Logic (For testing before Firebase connection)
        document.getElementById('post-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const postData = {
                title: document.getElementById('post-title').value,
                tag: document.getElementById('post-tag').value,
                thumbnail: document.getElementById('post-thumb').value,
                middleImage: document.getElementById('post-middle-img').value,
                content: document.getElementById('post-content').value
            };
            
            console.log("Post Ready to Upload:", postData);
            alert("Post Data Captured! (Check browser console). Firebase connect hone par ye live ho jayegi.");
        });
    </script>
</body>
</html>
